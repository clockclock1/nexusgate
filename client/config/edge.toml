node_id = "edge-demo"
token = "REPLACE_WITH_TOKEN_FROM_ADMIN"
name = "demo-edge"

# 过渡期控制面 = Admin Hub
hub_host = "127.0.0.1"
hub_control_port = 7100
hub_data_port = 7101
hub_token = "change-me-hub-token"

# 虚拟网 Overlay Node（管理面 VIP；与穿透端口映射无关）
[overlay]
enabled = true
port = 51820
listen = "0.0.0.0"
token = "change-me-overlay-token"
role = "node"
node_id = "edge-demo"
bootstrap = ["127.0.0.1:51820"]
create_tun = false

# 以下为兼容旧配置字段（Hub 模式下可忽略）
server = "127.0.0.1"
control_port = 7000
data_port = 7001

[[services]]
service_id = "web"
name = "local-web"
protocol = "tcp"
local_addr = "127.0.0.1:8000"
