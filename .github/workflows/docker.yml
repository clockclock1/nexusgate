name: Docker Image

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/nexusgate-server
  EDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/nexusgate-edge
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/nexusgate-web

jobs:
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build executables
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target "${{ matrix.target }}" -p p2p-server -p p2p-edge -p p2p-admin
          cp "target/${{ matrix.target }}/release/p2p-server" "dist/nexusgate-server-linux-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/p2p-edge" "dist/nexusgate-edge-linux-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/p2p-admin" "dist/nexusgate-admin-linux-${{ matrix.arch }}"

      - name: Upload executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.name }}
          path: |
            dist/nexusgate-server-linux-${{ matrix.arch }}
            dist/nexusgate-edge-linux-${{ matrix.arch }}
            dist/nexusgate-admin-linux-${{ matrix.arch }}
          if-no-files-found: error

  docker:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux executables
        uses: actions/download-artifact@v4
        with:
          pattern: docker-linux-*
          path: dist
          merge-multiple: true

      - name: Prepare executables
        run: |
          chmod +x dist/nexusgate-server-linux-amd64 dist/nexusgate-server-linux-arm64
          chmod +x dist/nexusgate-edge-linux-amd64 dist/nexusgate-edge-linux-arm64
          chmod +x dist/nexusgate-admin-linux-amd64 dist/nexusgate-admin-linux-arm64
          ls -lh dist

      - name: Set up QEMU with Docker Hub retry
        shell: bash
        run: |
          image="docker.io/tonistiigi/binfmt:latest"
          for attempt in 1 2 3 4; do
            if docker pull "$image"; then
              docker run --privileged --rm "$image" --install arm64
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "QEMU image pull failed (attempt $attempt/4); retrying in $((attempt * 15)) seconds..."
              sleep $((attempt * 15))
            fi
          done
          echo "Unable to pull $image after 4 attempts." >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Docker metadata (edge)
        id: meta-edge
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.EDGE_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.edge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-edge.outputs.tags }}
          labels: ${{ steps.meta-edge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
