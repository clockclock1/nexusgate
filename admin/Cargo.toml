[package]
name = "p2p-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NexusGate admin panel: embedded SPA + reverse proxy to API"

[[bin]]
name = "p2p-admin"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
mime_guess = "2"
parking_lot = { workspace = true }
p2p-common = { workspace = true }
p2p-control = { workspace = true }
p2p-dataplane = { workspace = true }
p2p-p2p = { workspace = true }
p2p-protocol = { workspace = true }
p2p-security = { workspace = true }
reqwest = { workspace = true }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
